<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio — Omor Faruk, Logo Designer</title>
<meta name="description" content="A collection of logo design projects by Omor Faruk.">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/favicon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg-layer" aria-hidden="true"></div>
<div class="cursor-glow" id="cursorGlow" aria-hidden="true"></div>

<!-- ================= NAVIGATION ================= -->
<header class="nav-wrap">
  <nav class="glass nav" id="nav">
    <a href="index.html#home" class="nav-mark">
      <img src="assets/logo.png" alt="Omor Faruk logo" class="nav-logo">
    </a>

    <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>

    <ul class="nav-links" id="navLinks">
      <li><a href="index.html#home" class="nav-link" data-nav>Home</a></li>
      <li><a href="index.html#about" class="nav-link" data-nav>About Me</a></li>
      <li><a href="index.html#services" class="nav-link" data-nav>What I Do</a></li>
      <li><a href="portfolio.html" class="nav-link active" data-nav>Portfolio</a></li>
      <li><a href="index.html#process" class="nav-link" data-nav>How I Work</a></li>
      <li><a href="index.html#contact" class="nav-link" data-nav>Contact</a></li>
    </ul>
  </nav>
</header>

<main>
  <!-- ================= PORTFOLIO GRID ================= -->
  <section class="section portfolio-page">
    <div class="section-inner">
      <h1 class="section-title reveal">Portfolio</h1>
      <p class="section-sub reveal">A collection of logo design projects — click any piece to view it full size.</p>

      <div class="portfolio-grid" id="portfolioGrid">
        <!-- populated by script.js -->
      </div>
    </div>
  </section>
</main>

<!-- ================= LIGHTBOX ================= -->
<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightboxClose" aria-label="Close image">&times;</button>
  <div class="lightbox-content">
    <img src="" alt="" id="lightboxImg">
    <div class="lightbox-meta">
      <span id="lightboxDate"></span>
      <span id="lightboxPrice"></span>
    </div>
  </div>
</div>

<!-- ================= FOOTER ================= -->
<footer class="footer">
  <div class="footer-inner">
    <div class="footer-brand">
      <span class="footer-name">OMOR FARUK</span>
      <span class="footer-role">Logo Designer</span>
    </div>
    <div class="footer-links">
      <a href="https://www.linkedin.com/" target="_blank" rel="noopener">LinkedIn</a>
      <a href="index.html#contact">Contact</a>
    </div>
    <p class="footer-copy">© <span id="year"></span> Omor Faruk. All rights reserved.</p>
  </div>
</footer>

<script src="script.js"></script>
</body>
</html>
